<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxWear - Ecommerce</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="/">SyntaxWear</a>

    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="#inicio">Início</a></li>
        <li><a href="#categorias">Categorias</a></li>
        <li><a href="#destaques">Destaques</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="inicio" aria-labelledby="inicio-titulo">
      <h1 id="inicio-titulo">Destaque principal</h1>
    </section>

    <section id="categorias" aria-labelledby="categorias-titulo">
      <h2 id="categorias-titulo">Categorias de tênis</h2>
    </section>

    <section id="destaques" aria-labelledby="destaques-titulo">
      <h2 id="destaques-titulo">Produtos em destaque</h2>
      <div class="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <section aria-labelledby="contato-titulo">
      <h2 id="contato-titulo">Contatos</h2>
      <address></address>
    </section>

    <nav aria-label="Links do rodapé"></nav>
  </footer>
</body>
</html>
